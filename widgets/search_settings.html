<style>
body{margin:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));font:14px system-ui;color:var(--tg-theme-text-color,#111)}
h1{font-size:16px;margin:0 0 10px}
.r{margin:0 0 14px}
.l{display:flex;justify-content:space-between;margin-bottom:6px}
.l b{font-variant-numeric:tabular-nums}
.t{position:relative;height:28px;touch-action:pan-y}
.t i,.t s{position:absolute;left:0;top:12px;height:4px;border-radius:2px}
.t i{right:0;background:var(--tg-theme-secondary-bg-color,#ddd)}
.t s{background:var(--tg-theme-button-color,#2a7d8c)}
.t u{position:absolute;top:3px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--tg-theme-button-color,#2a7d8c)}
.g{display:flex;flex-wrap:wrap;gap:6px}
.c{padding:6px 10px;border-radius:14px;background:var(--tg-theme-secondary-bg-color,#eee)}
.c.on{background:var(--tg-theme-button-color,#2a7d8c);color:var(--tg-theme-button-text-color,#fff)}
.h{color:var(--tg-theme-hint-color,#888);font-size:12px;margin:6px 0 0}
#s{display:block;width:100%;margin-top:14px;padding:11px;border-radius:10px;text-align:center;font-weight:600;background:var(--tg-theme-button-color,#2a7d8c);color:var(--tg-theme-button-text-color,#fff)}
</style>
<h1 id="h"></h1>
<div class="r"><div class="l">Бюджет до<b id="bv"></b></div><div class="t" id="bt"><i></i><s></s><u></u></div></div>
<div class="r"><div class="l">Площадь от<b id="av"></b></div><div class="t" id="at"><i></i><s></s><u></u></div></div>
<div class="r"><div class="l">Обязательно</div><div class="g" id="m"></div></div>
<div class="r"><div class="l">Районы</div><div class="g" id="d"></div><p class="h">Тап по району убирает его из поиска</p></div>
<div id="s">Сохранить</div>
<script>
const T=window.TelegramWidget,$=i=>document.getElementById(i);
let D={c:"Батуми",b:700,a:50,m:5,d:["Новый бульвар","6 Мая парк"],k:3};
try{const j=T&&T.chatData&&JSON.parse(T.chatData);if(j)D=Object.assign(D,j)}catch(e){}
const M=["Посудомойка","Духовка","Кондиционер","Балкон"];
$("h").textContent="Поиск · "+D.c;
function slider(id,vid,min,max,step,key,fmt){
const t=$(id),s=t.children[1],u=t.children[2];let w=0,L=0,on=0;
const draw=()=>{const p=(D[key]-min)/(max-min)*100;s.style.width=p+"%";u.style.left=p+"%";$(vid).textContent=fmt(D[key])};
const set=x=>{x-=L;let v=min+Math.max(0,Math.min(1,x/w))*(max-min);v=Math.round(v/step)*step;if(v!=D[key]){D[key]=v;draw();T&&T.HapticFeedback.selectionChanged()}};
t.addEventListener("pointerdown",e=>{on=1;const r=t.getBoundingClientRect();L=r.left;w=r.width||300;set(e.clientX)});
t.addEventListener("pointermove",e=>{on&&set(e.clientX)});
t.addEventListener("pointerup",()=>on=0);
t.addEventListener("pointercancel",()=>on=0);
draw()}
slider("bt","bv",200,2000,50,"b",v=>" $"+v);
slider("at","av",20,150,5,"a",v=>" "+v+" м²");
function chips(id,names,key){const g=$(id);names.forEach((n,i)=>{const c=document.createElement("div");c.className="c";c.textContent=n;
const f=()=>c.classList.toggle("on",!!(D[key]>>i&1));f();
c.addEventListener("click",()=>{D[key]^=1<<i;f();T&&T.HapticFeedback.impactOccurred("light")});g.appendChild(c)})}
chips("m",M,"m");
chips("d",D.d,"k");
$("s").addEventListener("click",()=>{const p="set_b"+D.b+"a"+D.a+"m"+D.m+"k"+D.k;
T&&T.HapticFeedback.notificationOccurred("success");
T?T.openTelegramLink("https://t.me/Apartmenthuner_bot?start="+p):$("s").textContent=p});
T&&T.ready();
</script>
