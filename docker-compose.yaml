x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:-postgres://apartment_hunter:apartment_hunter@postgres:5432/apartment_hunter?sslmode=disable}
  TELEGRAM_SESSION_FILE: ${TELEGRAM_SESSION_FILE:-/app/.telegram/userbot.session}
  TELEGRAM_MEDIA_DIR: ${TELEGRAM_MEDIA_DIR:-/app/.telegram/media}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
  TELEGRAM_PHONE: ${TELEGRAM_PHONE:-}
  TELEGRAM_PASSWORD: ${TELEGRAM_PASSWORD:-}
  TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING:-}
  TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
  TELEGRAM_ALLOWED_USERNAMES: ${TELEGRAM_ALLOWED_USERNAMES:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_PREFERENCES_MODEL: ${OPENAI_PREFERENCES_MODEL:-}
  OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
  OPENAI_VISION_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_INPUT_PRICE_PER_MILLION_USD:-0.40}
  OPENAI_VISION_CACHED_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_CACHED_INPUT_PRICE_PER_MILLION_USD:-0.10}
  OPENAI_VISION_OUTPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_OUTPUT_PRICE_PER_MILLION_USD:-1.60}
  APARTMENT_HUNTER_PROFILE_ID: ${APARTMENT_HUNTER_PROFILE_ID:-telegram_0}
  APARTMENT_HUNTER_GOOGLE_MAPS_API_KEY: ${APARTMENT_HUNTER_GOOGLE_MAPS_API_KEY:-}
  APARTMENT_HUNTER_GEOCODING_REGION: ${APARTMENT_HUNTER_GEOCODING_REGION:-Batumi, Georgia}
  APARTMENT_HUNTER_GEOCODING_LANGUAGE: ${APARTMENT_HUNTER_GEOCODING_LANGUAGE:-en}
  APARTMENT_HUNTER_POLL_INTERVAL: ${APARTMENT_HUNTER_POLL_INTERVAL:-5m}

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apartment_hunter}
      POSTGRES_USER: ${POSTGRES_USER:-apartment_hunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apartment_hunter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_hunter -d apartment_hunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    command: ["telegram"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - telegram-session:/app/.telegram

  worker:
    build: .
    profiles:
      - worker
    command: ["telegram-process", "${APARTMENT_HUNTER_PROFILE_ID:-telegram_0}"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-environment
    volumes:
      - telegram-session:/app/.telegram

volumes:
  postgres-data:
  telegram-session:
