<style>
body{margin:0;padding:10px 12px 12px;font:14px system-ui;color:var(--tg-theme-text-color,#111)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
#p{font-size:20px;font-weight:600}
#s{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.c{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--tg-theme-secondary-bg-color,#eee)}
.y{background:rgba(58,165,93,.16);color:#2f9a52}
.n{background:rgba(224,83,61,.16);color:#e0533d}
.h{color:var(--tg-theme-hint-color,#888);font-size:13px;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#t{display:flex;gap:4px;margin:10px 0 8px}
#t div{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--tg-theme-secondary-bg-color,#eee)}
#t .on{background:var(--tg-theme-button-color,#2a7d8c);color:var(--tg-theme-button-text-color,#fff)}
.q{height:208px;overflow:hidden}
.g{display:flex;flex-wrap:wrap;gap:4px}
.u{font-size:13px;line-height:1.4;margin:8px 0 0}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
td{padding:2px 6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td:first-child{width:12px}
td:nth-child(2){width:46%}
td:last-child{color:var(--tg-theme-hint-color,#888);text-align:right;padding-right:0}
</style>
<div class="r"><div id="p"></div><div id="s"></div></div>
<div class="h" id="f"></div>
<div id="t"></div>
<div class="q" id="o"></div>
<div class="q" id="k"></div>
<div class="q" id="m"></div>
<script>
const D=__LISTING__,$=i=>document.getElementById(i),T=window.TelegramWidget,H=T&&T.HapticFeedback;
const E=(g,c,x)=>{const e=document.createElement(g);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const M=["–","✓","✗"];
$("p").textContent=D.p?"$"+D.p+" / мес":"Цена не указана";
const s=$("s");s.textContent=D.v;s.className=D.ok?"y":"n";
$("f").textContent=D.f;
const g=E("div","g");
D.c.forEach(c=>{if(c[1]){const e=E("span","c "+(c[1]==1?"y":"n"),c[0]+" "+M[c[1]]);g.appendChild(e)}});
$("o").appendChild(g);
if(D.t)$("o").appendChild(E("p","u",D.t));
const b=E("table");
D.c.forEach(c=>{const r=E("tr");r.appendChild(E("td","",M[c[1]]));r.appendChild(E("td","",c[0]));r.appendChild(E("td","",c[2]||""));b.appendChild(r)});
$("k").appendChild(b);
if(D.m){const m=D.m;let v='<svg viewBox="0 0 '+m.w+" "+m.h+'" width="100%" height="'+m.h+'"><rect width="'+m.w+'" height="'+m.h+'" rx="8" fill="var(--tg-theme-secondary-bg-color,#eee)"/>';
m.z.forEach(z=>{let d="";for(let i=0;i<z.length;i+=2)d+=(i?"L":"M")+z[i]+" "+z[i+1];v+='<path d="'+d+'Z" fill="#3aa55d" fill-opacity=".22" stroke="#2f9a52" stroke-width="1.5"/>'});
v+='<circle cx="'+m.x+'" cy="'+m.y+'" r="6" fill="#e0533d" stroke="#fff" stroke-width="2"/>';
v+='<path d="M10 '+(m.h-10)+"h"+m.l+'" stroke="var(--tg-theme-text-color,#111)" stroke-width="2"/><text x="10" y="'+(m.h-15)+'" font-size="11" fill="var(--tg-theme-text-color,#111)">'+m.s+"</text></svg>";
$("m").innerHTML=v}
const P=[["o","Обзор"],["k","Критерии"]];if(D.m)P.push(["m","Карта"]);
const show=id=>{P.forEach(q=>{$(q[0]).style.display=q[0]==id?"block":"none";$("t"+q[0]).className=q[0]==id?"on":""})};
P.forEach(q=>{const e=E("div","",q[1]);e.id="t"+q[0];e.addEventListener("click",()=>{show(q[0]);H&&H.selectionChanged()});$("t").appendChild(e)});
$("m").style.display="none";show("o");
T&&T.ready();
</script>
