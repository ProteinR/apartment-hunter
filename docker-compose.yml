services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apartment_hunter
      POSTGRES_USER: apartment_hunter
      POSTGRES_PASSWORD: apartment_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_hunter -d apartment_hunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    command: ["telegram", "/app/preferences"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - app-preferences:/app/preferences

  worker:
    build: .
    command: ["telegram-process", "/app/preferences/profiles.json", "${APARTMENT_HUNTER_PROFILE_ID:-telegram_0}"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apartment_hunter:apartment_hunter@postgres:5432/apartment_hunter?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_PHONE: ${TELEGRAM_PHONE}
      TELEGRAM_PASSWORD: ${TELEGRAM_PASSWORD:-}
      TELEGRAM_SESSION_FILE: /app/.telegram/userbot.session
      TELEGRAM_MEDIA_DIR: /app/.telegram/media
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4.1-mini}
      OPENAI_VISION_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_INPUT_PRICE_PER_MILLION_USD:-0.40}
      OPENAI_VISION_CACHED_INPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_CACHED_INPUT_PRICE_PER_MILLION_USD:-0.10}
      OPENAI_VISION_OUTPUT_PRICE_PER_MILLION_USD: ${OPENAI_VISION_OUTPUT_PRICE_PER_MILLION_USD:-1.60}
      APARTMENT_HUNTER_POLL_INTERVAL: ${APARTMENT_HUNTER_POLL_INTERVAL:-5m}
    volumes:
      - app-preferences:/app/preferences
      - telegram-session:/app/.telegram

volumes:
  postgres-data:
  app-preferences:
  telegram-session:
