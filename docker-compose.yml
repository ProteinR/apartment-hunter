services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apartment_hunter
      POSTGRES_USER: apartment_hunter
      POSTGRES_PASSWORD: apartment_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_hunter -d apartment_hunter"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    command: ["telegram", "/app/preferences"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - app-preferences:/app/preferences

  worker:
    build: .
    profiles:
      - worker
    command: ["telegram-process", "/app/preferences/profiles.json", "${APARTMENT_HUNTER_PROFILE_ID:-telegram_0}"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://apartment_hunter:apartment_hunter@postgres:5432/apartment_hunter?sslmode=disable
      TELEGRAM_SESSION_FILE: /app/.telegram/userbot.session
      TELEGRAM_MEDIA_DIR: /app/.telegram/media
    volumes:
      - app-preferences:/app/preferences
      - telegram-session:/app/.telegram

volumes:
  postgres-data:
  app-preferences:
  telegram-session:
